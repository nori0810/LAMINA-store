<!DOCTYPE html> 

<html lang="ja"> 

<head> 

  <meta charset="UTF-8"> 

  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  

  <title>OFFICIAL LOGIN</title> 

  

  <!-- CSS読み込み --> 

  <link rel="stylesheet" href="member.css"> 

</head> 

  

<body> 

  

  <!-- HEADER --> 

  <header> 

    <div class="logo">LAMINA</div> 

  </header> 

  

  <!-- LOGIN --> 

  <main class="login-container"> 

  

    <div class="login-title"> 

      <h1>LOGIN</h1> 

      <p>ログイン</p> 

    </div> 

  

    <form action="#" method="post"> 

  

      <!-- メールアドレス --> 

      <div class="form-group"> 

        <label for="email">メールアドレス</label> 

        <input 

          type="email" 

          id="email" 

          name="email" 

          placeholder="メールアドレスを入力" 

          required 

        > 

      </div> 

  

      <!-- パスワード --> 

      <div class="form-group"> 

        <label for="password">パスワード</label> 

        <input 

          type="password" 

          id="password" 

          name="password" 

          placeholder="パスワードを入力" 

          required 

        > 

  

        <a href="#" class="forgot"> 

          パスワードをお忘れの方はこちら 

        </a> 

      </div> 

  

      <!-- ログインボタン --> 

      <button type="submit" class="login-button"> 

        LOGIN 

      </button> 

  

    </form> 

  

    <!-- 区切り線 --> 

    <div class="divider"> 

      NEW CUSTOMER 

    </div> 

  

    <!-- 新規登録 --> 

    <div class="register"> 

      <p>初めてご利用のお客様はこちら</p> 

  

      <a href="#" class="register-button"> 

        CREATE ACCOUNT 

      </a> 

    </div> 

  

  </main> 

  

  <!-- FOOTER --> 

  <footer> 

    <p>© 2026 LAMINA OFFICIAL</p> 

  </footer> 

  
<script src="member.js"></script>
</body> 

</html>
